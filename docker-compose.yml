services:
  mysql:
    image: mysql:8.4
    container_name: oms-mysql
    environment:
      MYSQL_DATABASE: oms
      MYSQL_USER: oms
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: root-change-me
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - oms-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uoms -pchange-me"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oms-mysql-data:
